basePath: /
definitions:
  model.CreateLogRequest:
    properties:
      level:
        type: string
      message:
        type: string
      service:
        type: string
    type: object
  model.ErrorResponse:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  model.Log:
    properties:
      created_at:
        type: string
      id:
        type: string
      level:
        type: string
      message:
        type: string
      service:
        type: string
    type: object
  model.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  model.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  model.RegisterRequest:
    properties:
      password:
        type: string
      role:
        type: string
      username:
        type: string
    required:
    - password
    - role
    - username
    type: object
host: localhost:8080
info:
  contact: {}
  description: Logging service with REST + gRPC
  title: Log Service API
  version: "1.0"
paths:
  /api/v1/logs:
    post:
      consumes:
      - application/json
      description: Insert a log entry
      parameters:
      - description: Log input
        in: body
        name: log
        required: true
        schema:
          $ref: '#/definitions/model.CreateLogRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Log'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new log
      tags:
      - logs
  /api/v1/logs/batch:
    post:
      consumes:
      - application/json
      description: Insert multiple log entries (max 500)
      parameters:
      - description: List of logs
        in: body
        name: logs
        required: true
        schema:
          items:
            $ref: '#/definitions/model.CreateLogRequest'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/model.Log'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create logs in batch
      tags:
      - logs
  /api/v1/logs/search:
    get:
      description: Filter logs by level/service/regex
      parameters:
      - description: Log level
        in: query
        name: level
        type: string
      - description: Service name
        in: query
        name: service
        type: string
      - description: Regex filter
        in: query
        name: regex
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Log'
            type: array
      security:
      - BearerAuth: []
      summary: Search logs
      tags:
      - logs
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate and return JWT tokens
      parameters:
      - description: Login body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Generate new access token using refresh token
      parameters:
      - description: Refresh body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create new user account
      parameters:
      - description: Register body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: created
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Register user
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
