version: "3"
services:
  postgres:
    image: postgres:16-alpine
    container_name: logservice-postgres
    restart: always
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: logdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loguser"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: logservice-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
  app:
    build: .
    container_name: logservice-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://loguser:secret@postgres:5432/logdb?sslmode=disable
    ports:
      - "8080:8080"
      - "50051:50051"
volumes:
  pgdata: