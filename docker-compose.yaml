version: "3"
services:
  postgres:
    image: postgres:16-alpine
    container_name: logservice-postgres
    restart: always
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: logdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    container_name: logservice-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
volumes:
  pgdata: